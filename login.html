<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link
    href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700;900&display=swap"
    rel="stylesheet">
<style>
    body { font-family: 'Roboto', sans-serif; }
    .brand-font { font-family: 'Hind Madurai', sans-serif; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-indigo-900 to-slate-900 px-4">

    <div class="w-full max-w-md">
        <div class="bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl shadow-2xl p-8">

            <div class="text-center mb-8">
                <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-indigo-600 flex items-center justify-center">
                    <i class="fa-solid fa-lock text-white text-2xl"></i>
                </div>
                <h1 class="brand-font text-2xl font-semibold text-white">Welcome Back</h1>
                <p class="text-slate-300 text-sm mt-1">Sign in to continue</p>
            </div>

            <div id="errorBox" class="nodisplay mb-4 bg-red-500/20 border border-red-500 text-red-200 text-sm rounded-lg px-4 py-3 flex items-center gap-2">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="errorText"></span>
            </div>

            <form id="loginForm" novalidate>
                <div class="mb-4">
                    <label class="block text-slate-200 text-sm mb-1" for="username">Username</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="username" name="username" autocomplete="username"
                            class="w-full pl-10 pr-4 py-2.5 rounded-lg bg-white/10 border border-white/20 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                            placeholder="Enter username">
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-slate-200 text-sm mb-1" for="password">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-key absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="password" id="password" name="password" autocomplete="current-password"
                            class="w-full pl-10 pr-10 py-2.5 rounded-lg bg-white/10 border border-white/20 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                            placeholder="Enter password">
                        <button type="button" id="togglePwd" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
                            <i class="fa-solid fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 transition text-white font-medium py-2.5 rounded-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Login</span>
                </button>
            </form>
        </div>
    </div>

<script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('errorBox');
    const errorText = document.getElementById('errorText');
    const togglePwd = document.getElementById('togglePwd');
    const toggleIcon = document.getElementById('toggleIcon');
    const passwordInput = document.getElementById('password');

    const VALID_USERNAME = "mahi";
    const VALID_PASSWORD = "22-47635-2";

    function showError(message) {
        errorText.textContent = message;
        errorBox.classList.remove('nodisplay');
    }

    function hideError() {
        errorBox.classList.add('nodisplay');
        errorText.textContent = '';
    }

    togglePwd.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        toggleIcon.classList.toggle('fa-eye');
        toggleIcon.classList.toggle('fa-eye-slash');
    });

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        hideError();

        try {
            const usernameInput = document.getElementById('username').value;
            const passwordVal = document.getElementById('password').value;

            const username = usernameInput === null || usernameInput === undefined ? '' : usernameInput.trim();
            const password = passwordVal === null || passwordVal === undefined ? '' : passwordVal.trim();

            if (username === null || username === '') {
                throw new Error('Username cannot be empty.');
            }

            if (password === null || password === '') {
                throw new Error('Password cannot be empty.');
            }

            if (username !== VALID_USERNAME || password !== VALID_PASSWORD) {
                throw new Error('Invalid username or password.');
            }

            // Success
            window.location.href = 'index.html';

        } catch (err) {
            showError(err.message);
        }
    });
</script>
</body>
</html>
